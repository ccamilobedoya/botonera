name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # CI runs without the private-terms list.
      - run: scripts/setup
      - run: npm ci
      - run: scripts/review
      - name: README smoke
        run: sed -n '/^<!-- smoke -->$/,/^<!-- \/smoke -->$/p' README.md | sed '/^```/d;/^<!--/d' | sh -ex
