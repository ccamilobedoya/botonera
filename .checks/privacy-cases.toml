# Cases for the privacy scanner. Each case is one file; `expect` is the rule that must
# report it, or "clean". The scanner runs them with `--self-test`, and the tests run them
# as staged files in a throwaway repo. The terms are synthetic.
#
# Tokens are written as pieces in [parts] and joined at run time ({NAME} in `content`),
# so no file holds a string shaped like a real secret.

terms = ["lumbrera", "josé pérez"]

[parts]
ROOT = ["#", "root/"]
HOME = ["/ho", "me/"]
GHP = ["gh", "p_", "Zx9QwErTyUiOpAsDfGhJkLzXcVbNm1234567"]
GHPAT = ["github", "_pat_", "11ABCDEFG0123456789_abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWX"]
AKIA = ["AK", "IA", "QWERTYUIOPASDFGH"]
XOXB = ["xo", "xb-", "1234567890-abcdefghijklmn"]
JWT = ["ey", "JhbGciOiJIUzI1NiJ9", ".", "ey", "JzdWIiOiIxMjM0NTY3ODkwIn0", ".", "c2lnbmF0dXJl"]
PEM = ["-----BEGIN RSA PRI", "VATE KEY-----\nMIIBOgIBAAJBAKj34GkxFhD90vcNLYLInFEX6Ppy1tPf9Cnzj4p4WGeKLs1Pt8Qu\n-----END RSA PRI", "VATE KEY-----"]
SKANT = ["sk", "-ant-", "api03-abcdefghijklmnopqrstuvwxyz012345"]

# --- private terms -------------------------------------------------------
[[case]]
id = "term-lower-md"
path = "notes/a.md"
content = "Notes about lumbrera.\n"
expect = "term"

[[case]]
id = "term-upper-md"
path = "notes/b.md"
content = "LUMBRERA IN CAPITALS\n"
expect = "term"

[[case]]
id = "term-in-code"
path = "src/c.ts"
content = "export const label = \"Lumbrera\";\n"
expect = "term"

[[case]]
id = "term-in-json"
path = "data/d.json"
content = "{\"owner\": \"lumbrera\"}\n"
expect = "term"

[[case]]
id = "term-nfc-accents"
path = "notes/e.md"
content = "Habló José Pérez.\n"
expect = "term"

[[case]]
id = "term-nfd-accents"
path = "notes/f.md"
content = "Habló José Pérez.\n"
expect = "term"

[[case]]
id = "term-without-accents"
path = "notes/g.md"
content = "Hablo jose perez.\n"
expect = "term"

[[case]]
id = "term-split-by-markdown-bold"
path = "notes/h.md"
content = "The **lum**brera project.\n"
expect = "term"

[[case]]
id = "term-split-by-markdown-emphasis"
path = "notes/i.md"
content = "The lum*bre*ra project.\n"
expect = "term"

[[case]]
id = "term-in-file-name"
path = "notes/lumbrera-plan.md"
content = "Nothing private inside.\n"
expect = "file-name-term"

[[case]]
id = "accented-file-name-nfd"
path = "notas-José.md"
content = "Notas de José Pérez.\n"
expect = "term"

[[case]]
id = "term-in-png-metadata"
path = "img/photo.png"
content_b64 = "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAAGXRFWHRDb21tZW50AHBob3RvIG9mIGx1bWJyZXJhlBBSbwAAAAxJREFUeJxjYGBgAAAABAAB9hc4VQAAAABJRU5ErkJggg=="
expect = "term"

[[case]]
id = "clean-png"
path = "img/clean.png"
content_b64 = "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAADElEQVR4nGNgYGAAAAAEAAH2FzhVAAAAAElFTkSuQmCC"
expect = "clean"

